name: my_flutter_template

environment:
  sdk: ^3.10.0

workspace:
  # apps
  - apps/my_app
  - apps/widgetbook
  # packages
  - packages/cores/core
  - packages/cores/assets
  - packages/features/auth
  - packages/features/github_repository

melos:
  sdkPath: .fvm/flutter_sdk

  ide:
    intellij:
      enabled: false

  command:
    clean:
      hooks:
        post: |
          melos exec --flutter -- "flutter clean"
    version:
      branch: main
      releaseUrl: true

  scripts:
    fix:
      exec:
        command: |
          dart fix --apply lib
          dart run custom_lint --fix
        concurrency: 1
      description: Fix dart files.
      packageFilters:
        dirExists: lib

    pub-get:
      exec:
        command: |
          fvm flutter pub get
        concurrency: 1
      description: pub get.
      packageFilters:
        dirExists: lib

    gen:
      exec:
        command: dart run build_runner build --delete-conflicting-outputs
        concurrency: 1
      description: Generate code.
      packageFilters:
        dirExists: lib
        dependsOn: "build_runner"

    gen:assets:
      exec:
        command: dart run build_runner build --delete-conflicting-outputs
        concurrency: 1
      description: Generate code.
      packageFilters:
        dirExists: lib
        dependsOn: "build_runner"
        scope: "cores_assets"

    gen:watch:
      exec:
        command: dart run build_runner watch --delete-conflicting-outputs
        concurrency: 99
      description: Generate code in watch mode.
      packageFilters:
        dirExists: lib
        dependsOn: "build_runner"

    test:
      exec:
        command: flutter test
        failFast: true
      description: Run flutter test.
      packageFilters:
        flutter: true
        dirExists: test

    pod:ios:
      exec:
        command: |
          cd ios
          rm -f Podfile.lock
          pod install --repo-update
        concurrency: 1
      description: Run pod install on iOS.
      packageFilters:
        dirExists: [lib, ios]
        fileExists: "ios/Podfile"

    package:update:
      exec:
        command: |
          fvm flutter pub upgrade
        concurrency: 1
      description: Update package dependencies.
      packageFilters:
        dirExists: lib

    package:update-major:
      exec:
        command: |
          fvm flutter pub upgrade --major-versions
        concurrency: 1
      description: Update package dependencies.
      packageFilters:
        dirExists: lib
dev_dependencies:
  melos: ^8.6.0
